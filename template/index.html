<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════
  你嘅學習平台 —— 起手檔
  ══════════════════════════════════════════════

  點用：
  1. 呢個檔改名做 index.html（如果未係）
  2. 撳 ▶ 跑一次，睇下而家個樣
  3. 然後照住課程網站嘅步驟，一步步叫 AI 加嘢

  呢個檔而家已經「行得」——  唔會白畫面。
  每次只改一個位，改完即刻跑一次。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ↓ 呢行係「喺瀏覽器 tab 上面顯示嘅名」。改成你嘅平台名。 -->
<title>我嘅學習平台</title>

<style>
  /* ↓ 呢段係「外觀」。而家先唔使改，之後叫 AI 幫你改就得。 */
  body{
    margin:0;
    font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;
    background:#f7fafc;
    color:#0f172a;
    line-height:1.7;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px}
  h1{font-size:30px;margin:0 0 6px}
  .sub{color:#64748b;margin:0 0 28px}
  .card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:18px;
    margin-bottom:12px;
    font-size:18px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ↓↓↓ 喺呢度改你嘅平台名 ↓↓↓ -->
  <h1>我嘅學習平台</h1>
  <p class="sub">一句話介紹你個平台</p>

  <!--
    ↓↓↓ 下面係「科目卡」。
    而家得一個，你可以複製多幾個，或者叫 AI 幫你加。
  ↓↓↓ -->
  <div class="card">📘 科目一</div>

  <!-- ↓↓↓ 想加多啲科目，喺呢度加。例：
  <div class="card">🔬 科目二</div>
  <div class="card">📐 科目三</div>
  -->

</div>
</body>
</html>
