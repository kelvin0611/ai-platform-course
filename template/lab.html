<!DOCTYPE html>
<!--
  範例虛擬實驗 —— 密度
  呢個係「示範」，你堂 1 可以用 AI 整一個自己嘅，然後改名覆蓋呢個檔。
  記住：如果你換咗呢個檔，index.html 唔使改（src 一樣係 lab.html）。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虛擬實驗 · 密度</title>
<style>
  body{
    margin:0; padding:22px;
    font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;
    background:#fff; color:#0f172a; line-height:1.7; font-size:16px;
  }
  h2{margin:0 0 4px; font-size:21px}
  .hint{color:#64748b; font-size:14px; margin:0 0 20px}
  .row{margin-bottom:16px}
  label{display:block; font-weight:600; margin-bottom:6px; font-size:15px}
  input[type=range]{width:100%}
  .val{color:#3987A3; font-weight:700; font-variant-numeric:tabular-nums}
  .result{
    background:#e6f6fb; border-radius:12px; padding:16px;
    margin-top:20px; text-align:center;
  }
  .result .big{font-size:32px; font-weight:800; color:#3987A3;
    font-variant-numeric:tabular-nums; line-height:1.2}
  .result .unit{font-size:15px; color:#64748b; font-weight:600}
  .say{font-size:15px; margin-top:12px; color:#334155}
</style>
</head>
<body>

<h2>🧪 密度係咩？</h2>
<p class="hint">拉吓下面兩個滑桿，睇下密度點變。</p>

<div class="row">
  <label>質量：<span class="val" id="mv">100</span> g</label>
  <input type="range" id="mass" min="10" max="500" value="100" step="10">
</div>

<div class="row">
  <label>體積：<span class="val" id="vv">50</span> cm³</label>
  <input type="range" id="vol" min="10" max="500" value="50" step="10">
</div>

<div class="result">
  <div class="big" id="d">2.00</div>
  <div class="unit">g/cm³</div>
  <div class="say" id="say"></div>
</div>

<script>
  var m = document.getElementById('mass');
  var v = document.getElementById('vol');

  function update(){
    var mass = Number(m.value), vol = Number(v.value);
    document.getElementById('mv').textContent = mass;
    document.getElementById('vv').textContent = vol;

    var d = mass / vol;
    document.getElementById('d').textContent = d.toFixed(2);

    // 用水（1.00 g/cm³）做比較 —— 呢句就係「解釋點解」
    var say;
    if (d > 1.02)      say = '比水重 → 放落水會沉。';
    else if (d < 0.98) say = '比水輕 → 放落水會浮。';
    else               say = '同水差唔多 → 可能會浮喺中間。';
    document.getElementById('say').textContent = '密度 = 質量 ÷ 體積。' + say;
  }

  m.addEventListener('input', update);
  v.addEventListener('input', update);
  update();
</script>
</body>
</html>
